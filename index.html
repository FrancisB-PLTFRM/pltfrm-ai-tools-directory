<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLTFRM Digital - Advertising | AI Directory</title>
</head>
<body>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  :root{
    --black: #FFFFFF;
    --white: #0A0A0A;
    --off-white: #0A0A0A;
    --line: rgba(255,255,255,0.14);
    --line-strong: rgba(255,255,255,0.22);
    --gray-700: #C4C4C4;
    --gray-500: #8C8C8C;
    --gray-300: #3A3A3A;
    --surface: rgba(255,255,255,0.055);
    --surface-hover: rgba(255,255,255,0.09);
    --field-bg: rgba(255,255,255,0.06);
    --radius: 10px;
    --radius-lg: 16px;
    --radius-pill: 999px;
  }

  * { box-sizing: border-box; }

  /* Ensures the dark background fills the whole viewport when this file is
     opened as a standalone page (e.g. the exported/hosted copy), rather than
     only as tall as the content. Harmless when embedded in an artifact host. */
  html, body{
    height: 100%;
    margin: 0;
    padding: 0;
    background: #0A0A0A;
  }

  #registry-root{
    background: var(--off-white);
    color: var(--black);
    font-family: 'Inter', sans-serif;
    min-height: 100%;
    padding: 36px 20px 64px;
    display: flex;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
    position: relative;
    overflow: hidden;
    color-scheme: dark;
  }
  #registry-root::before, #registry-root::after{
    content: '';
    position: absolute;
    border-radius: 50%;
    filter: blur(110px);
    pointer-events: none;
    z-index: 0;
  }
  #registry-root::before{
    width: 460px; height: 460px;
    top: -140px; left: -120px;
    background: rgba(255,255,255,0.10);
  }
  #registry-root::after{
    width: 420px; height: 420px;
    bottom: -160px; right: -100px;
    background: rgba(255,255,255,0.06);
  }

  #registry-inner{ width: 100%; max-width: 780px; position: relative; z-index: 1; }
  #registry-inner.category-mode{ max-width: 1040px; }

  /* ---------- Header ---------- */
  .rg-header{
    margin-bottom: 24px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--line-strong);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
  }
  .rg-header-text{ flex: 1 1 320px; min-width: 0; }
  .rg-header-actions{ display: flex; gap: 8px; flex-shrink: 0; flex-wrap: wrap; }
  .rg-export-btn{
    flex-shrink: 0;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 12.5px;
    letter-spacing: 0.02em;
    background: transparent;
    color: var(--black);
    border: 1px solid var(--black);
    padding: 8px 14px;
    border-radius: var(--radius);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    transition: all .12s ease;
  }
  .rg-export-btn:hover{ background: var(--black); color: var(--white); }
  .rg-eyebrow{
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--gray-500);
    margin: 0 0 12px;
  }
  .rg-title{
    font-family: 'Inter', sans-serif;
    font-weight: 800;
    font-size: 32px;
    letter-spacing: -0.01em;
    line-height: 1.1;
    margin: 0 0 8px;
    color: var(--black);
  }
  .rg-sub{
    font-size: 14px;
    line-height: 1.5;
    color: var(--gray-500);
    margin: 0;
    max-width: 480px;
  }

  /* ---------- Toolbar ---------- */
  .rg-toolbar{
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    margin: 0 0 20px;
    padding-bottom: 0;
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  .rg-tabs{ display: flex; gap: 32px; align-self: stretch; }
  .rg-tab-btn{
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--gray-500);
    padding: 8px 2px 15px;
    margin-bottom: -1px;
    cursor: pointer;
    transition: color .15s ease, border-color .15s ease;
  }
  .rg-tab-btn:hover{ color: var(--gray-700); }
  .rg-tab-btn.active{
    background: none;
    color: var(--black);
    border-bottom-color: var(--black);
  }

  .rg-toolbar-actions{ display: flex; gap: 8px; flex-wrap: wrap; }

  .rg-new-btn{
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.02em;
    background: var(--black);
    color: var(--white);
    border: 1px solid var(--black);
    padding: 9px 16px;
    border-radius: var(--radius);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: opacity .12s ease;
  }
  .rg-new-btn:hover{ opacity: 0.82; }
  .rg-new-btn:active{ opacity: 0.65; }

  /* ---------- Sort / filter controls + bulk bar (glass strip) ---------- */
  .rg-controls, .rg-bulk-bar{
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    background: var(--surface);
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 10px 14px;
    margin-bottom: 10px;
  }
  .rg-bulk-bar{ justify-content: space-between; }
  .rg-control-group{ display: flex; align-items: center; gap: 8px; }
  .rg-control-group label{
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--gray-500);
  }
  .rg-control-group select{
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 13px;
    background: var(--field-bg);
    color: var(--black);
    border: 1px solid var(--gray-300);
    border-radius: 8px;
    padding: 6px 9px;
    cursor: pointer;
    color-scheme: dark;
  }
  .rg-control-group select option{ background: #1a1a1a; color: #ffffff; }
  .rg-control-group select:focus{ outline: none; border-color: var(--black); }
  .rg-control-group select:hover{ border-color: var(--black); }
  .rg-control-group input[type="number"]{
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 13px;
    background: var(--field-bg);
    color: var(--black);
    border: 1px solid var(--gray-300);
    border-radius: 8px;
    padding: 6px 9px;
    width: 64px;
  }
  .rg-control-group input[type="number"]:focus{ outline: none; border-color: var(--black); }
  .rg-search-group{ flex: 1 1 240px; }
  .rg-search-group input[type="text"]{
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 13px;
    background: var(--field-bg);
    color: var(--black);
    border: 1px solid var(--gray-300);
    border-radius: 8px;
    padding: 6px 10px;
    flex: 1;
    min-width: 120px;
  }
  .rg-search-group input[type="text"]:focus{ outline: none; border-color: var(--black); }
  .rg-search-group select{ flex-shrink: 0; }
  .rg-view-toggle{ display: flex; gap: 4px; }
  .rg-view-btn{
    width: 32px; height: 32px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--gray-300);
    background: transparent;
    color: var(--gray-500);
    border-radius: 8px;
    cursor: pointer;
    transition: all .12s ease;
  }
  .rg-view-btn svg{ width: 15px; height: 15px; }
  .rg-view-btn:hover{ border-color: var(--black); color: var(--black); }
  .rg-view-btn.active{ background: var(--black); border-color: var(--black); color: var(--white); }

  .rg-select-all{
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--gray-700);
    cursor: pointer;
    user-select: none;
  }
  .rg-select-all input{ accent-color: var(--black); width: 15px; height: 15px; cursor: pointer; }
  .rg-bulk-actions{ display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .rg-bulk-count{ font-size: 12.5px; color: var(--gray-500); }
  .rg-bulk-btn{
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 12.5px;
    letter-spacing: 0.02em;
    padding: 7px 14px;
    border-radius: 8px;
    cursor: pointer;
    border: 1px solid var(--black);
    background: transparent;
    color: var(--black);
  }
  .rg-bulk-btn:hover{ background: var(--black); color: var(--white); }
  .rg-bulk-btn.primary{ background: var(--black); color: var(--white); }
  .rg-bulk-btn.primary:hover{ opacity: 0.82; }

  /* ---------- Card list ---------- */
  .rg-list{ display: flex; flex-direction: column; gap: 10px; }
  .rg-list.grid-view{
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
  }
  .rg-list.grid-view .rg-card{ height: 100%; display: flex; flex-direction: column; }
  .rg-list.grid-view .rg-card-bottom{ margin-top: auto; }
  @media (max-width: 700px){
    .rg-list.grid-view{ grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 480px){
    .rg-list.grid-view{ grid-template-columns: 1fr; }
  }

  /* ---------- Category view: sidebar TOC + department tabs ---------- */
  .rg-dept-tabs{
    display: none;
    gap: 26px;
    flex-wrap: wrap;
    align-items: flex-end;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--line);
  }
  .rg-dept-tabs.visible{ display: flex; }
  .rg-dept-tab{
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 13.5px;
    letter-spacing: 0.02em;
    padding: 6px 2px 13px;
    margin-bottom: -1px;
    border: none;
    border-bottom: 2px solid transparent;
    background: none;
    color: var(--gray-500);
    cursor: pointer;
    transition: color .15s ease, border-color .15s ease;
  }
  .rg-dept-tab:hover{ color: var(--gray-700); }
  .rg-dept-tab.active{ background: none; color: var(--black); border-bottom-color: var(--black); }

  .rg-category-layout{ display: flex; gap: 28px; align-items: flex-start; }
  .rg-category-sidebar{ display: none; }
  .rg-list-area{ flex: 1; min-width: 0; }

  #registry-inner.category-mode .rg-category-sidebar{
    display: block;
    width: 220px;
    flex-shrink: 0;
    position: sticky;
    top: 20px;
    max-height: calc(100vh - 40px);
    overflow-y: auto;
    padding-right: 6px;
  }

  .rg-toc-dept{ margin-bottom: 4px; }
  .rg-toc-dept-header{
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 6px;
    border-radius: 6px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 13px;
    color: var(--gray-700);
    letter-spacing: -0.01em;
  }
  .rg-toc-dept-header:hover{ background: rgba(255,255,255,0.06); }
  .rg-toc-dept-header.active{ color: var(--black); }
  .rg-toc-dept-header.active .rg-toc-dept-name{ border-bottom: 2px solid var(--black); }
  .rg-toc-chevron{
    flex-shrink: 0;
    width: 14px; height: 14px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--gray-500);
    transition: transform .15s ease;
  }
  .rg-toc-chevron.collapsed{ transform: rotate(-90deg); }
  .rg-toc-dept-name{ flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rg-toc-dept-count{ font-size: 11px; font-weight: 500; color: var(--gray-500); }
  .rg-toc-entries{ list-style: none; margin: 0; padding: 0 0 6px 20px; }
  .rg-toc-entries.collapsed{ display: none; }
  .rg-toc-entry{
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    padding: 5px 6px;
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    color: var(--gray-500);
    cursor: pointer;
    border-radius: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .rg-toc-entry:hover{ color: var(--black); background: rgba(255,255,255,0.06); }

  .rg-card.rg-card-flash{ border-color: var(--black); box-shadow: 0 0 0 2px var(--black); }

  @media (max-width: 860px){
    #registry-inner.category-mode{ max-width: 780px; }
    .rg-category-sidebar{ display: none !important; }
    .rg-category-layout{ display: block; }
  }

  .rg-card{
    background: var(--surface);
    backdrop-filter: blur(18px) saturate(150%);
    -webkit-backdrop-filter: blur(18px) saturate(150%);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    color: var(--black);
    position: relative;
    padding: 16px 18px 12px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.25);
    transition: box-shadow .15s ease, border-color .15s ease;
  }
  .rg-card:hover{ box-shadow: 0 10px 34px rgba(0,0,0,0.35); border-color: var(--line-strong); }
  .rg-card.removed{ border-color: rgba(255,255,255,0.08); color: var(--gray-500); background: rgba(255,255,255,0.02); }
  .rg-card.removed:hover{ box-shadow: 0 6px 24px rgba(0,0,0,0.25); }
  .rg-card.removed .rg-card-title{ color: var(--gray-700); }

  .rg-card-top{
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .rg-card-check-wrap{ display: flex; align-items: center; padding-top: 3px; }
  .rg-card-check{ accent-color: var(--black); width: 16px; height: 16px; cursor: pointer; }
  .rg-suggest-edit-btn{
    flex-shrink: 0;
    width: 24px; height: 24px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    color: var(--gray-500);
    cursor: pointer;
    border-radius: 6px;
    margin-top: 1px;
  }
  .rg-suggest-edit-btn:hover{ color: var(--black); background: rgba(255,255,255,0.06); }
  .rg-suggest-edit-btn svg{ width: 13px; height: 13px; }
  .rg-card-title{
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 17px;
    letter-spacing: -0.01em;
    margin: 0;
    color: var(--black);
    flex: 1;
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 8px;
    row-gap: 4px;
  }
  .rg-chip{
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 11.5px;
    letter-spacing: 0.01em;
    display: inline-block;
    padding: 3px 10px;
    border-radius: var(--radius-pill);
    line-height: 1.5;
  }
  .rg-chip-dept{
    background: var(--black);
    color: var(--white);
  }
  .rg-card.removed .rg-chip-dept{ background: var(--gray-300); color: var(--gray-700); }
  .rg-chip-ai{
    background: transparent;
    border: 1px solid var(--gray-300);
    color: var(--gray-700);
    font-weight: 500;
    font-size: 10px;
    padding: 2px 8px;
  }
  .rg-card.removed .rg-chip-ai{ border-color: rgba(255,255,255,0.1); }
  .rg-chip-outline{
    background: transparent;
    border: 1px solid var(--gray-300);
    color: var(--gray-700);
    font-weight: 500;
  }
  .rg-tag-row{ display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0 26px; }

  .rg-card-desc{
    font-size: 14px;
    line-height: 1.5;
    color: var(--gray-700);
    margin: 10px 0 2px;
  }
  .rg-card-desc ul, .rg-card-desc ol{ margin: 4px 0; padding-left: 20px; }
  .rg-card-desc li{ margin: 2px 0; }
  .rg-card-desc.clamped{
    display: -webkit-box;
    -webkit-line-clamp: 4;
    line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
    max-height: 128px;
  }
  .rg-desc-toggle{
    display: none;
    background: none;
    border: none;
    padding: 0;
    margin: 4px 0 8px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.02em;
    color: var(--black);
    text-decoration: underline;
    cursor: pointer;
  }
  .rg-desc-toggle.visible{ display: inline-block; }

  .rg-card-poc{
    font-size: 12.5px;
    color: var(--gray-700);
    margin: 0 0 8px;
  }
  .rg-card-poc-label{
    font-weight: 600;
    text-transform: uppercase;
    font-size: 10px;
    letter-spacing: 0.06em;
    color: var(--gray-500);
    margin-right: 6px;
  }

  .rg-card-link-row{ display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .rg-card-link-row a{
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.02em;
    color: var(--white);
    background: var(--black);
    padding: 5px 11px;
    border-radius: var(--radius-pill);
    text-decoration: none;
    display: inline-block;
  }
  .rg-card-link-row a:hover{ opacity: 0.8; }
  .rg-card-link-row a.rg-link-secondary{
    background: transparent;
    color: var(--gray-700);
    border: 1px solid var(--gray-300);
    padding: 4px 10px;
    opacity: 1;
  }
  .rg-card-link-row a.rg-link-secondary:hover{ border-color: var(--black); color: var(--black); }

  .rg-card-bottom{
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-top: 8px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
    flex-wrap: wrap;
  }
  .rg-stamp{
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 11px;
    letter-spacing: 0.02em;
    color: var(--gray-500);
    display: inline-block;
  }
  .rg-card-meta{ display: flex; flex-direction: column; gap: 3px; }
  .rg-card-id-btn{
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    font-family: 'SFMono-Regular', Menlo, Consolas, monospace;
    font-size: 10.5px;
    letter-spacing: 0.02em;
    color: var(--gray-500);
  }
  .rg-card-id-btn:hover{ color: var(--black); }
  .rg-card-id-btn svg{ width: 11px; height: 11px; flex-shrink: 0; }
  .rg-actions{ display: flex; gap: 6px; }
  .rg-icon-btn{
    background: transparent;
    border: 1px solid var(--line);
    color: var(--black);
    width: 28px; height: 28px;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all .12s ease;
  }
  .rg-icon-btn:hover{ background: var(--black); color: var(--white); border-color: var(--black); }
  .rg-icon-btn svg{ width: 14px; height: 14px; }

  /* ---------- Empty state ---------- */
  /* ---------- Pagination ---------- */
  .rg-list-footer{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-top: 16px;
  }
  .rg-pagination{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }
  .rg-page-btn{
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 12.5px;
    padding: 7px 14px;
    border-radius: 8px;
    cursor: pointer;
    border: 1px solid var(--black);
    background: transparent;
    color: var(--black);
  }
  .rg-page-btn:hover:not(:disabled){ background: var(--black); color: var(--white); }
  .rg-page-btn:disabled{ opacity: 0.3; cursor: default; }
  .rg-page-info{ font-size: 12.5px; color: var(--gray-500); }

  .rg-empty{
    text-align: center;
    padding: 52px 20px;
    border: 1px dashed var(--gray-300);
    border-radius: var(--radius-lg);
    color: var(--gray-500);
    background: var(--surface);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .rg-empty-title{
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 18px;
    color: var(--black);
    margin: 0 0 6px;
  }
  .rg-empty p{ margin: 0; font-size: 13.5px; }

  /* ---------- Modal ---------- */
  .rg-modal-overlay{
    position: fixed; inset: 0;
    background: rgba(6,6,6,0.55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    padding: 20px;
    overflow-y: auto;
  }
  .rg-modal{
    background: rgba(20,20,20,0.72);
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    color: var(--black);
    width: 100%; max-width: 460px;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-lg);
    padding: 24px 24px 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    margin: auto;
  }
  .rg-modal-header{
    display: flex;
    align-items: flex-start;

            stack.push(child);
          }
        } else if(child.nodeType !== 3){
          node.removeChild(child);
        }
      }
    }
    return root.innerHTML.trim();
  }

  function htmlIsBlank(html){
    const d = document.createElement('div');
    d.innerHTML = html || '';
    return (d.textContent || '').trim().length === 0;
  }

  function plainText(html){
    const d = document.createElement('div');
    d.innerHTML = html || '';
    return d.textContent || '';
  }

  function distinctFieldValues(field){
    const seen = new Map();
    entries.forEach(e => {
      const v = (e[field] || '').trim();
      if(v && !seen.has(v.toLowerCase())) seen.set(v.toLowerCase(), v);
    });
    return Array.from(seen.values()).sort((a,b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));
  }

  const hasClaudeStorage = typeof window.storage !== 'undefined';

  async function loadEntries(){
    let loaded = null;
    try{
      if(hasClaudeStorage){
        const res = await window.storage.get(STORAGE_KEY, true);
        loaded = res && res.value ? JSON.parse(res.value) : null;
      } else {
        const raw = localStorage.getItem(STORAGE_KEY);
        loaded = raw ? JSON.parse(raw) : null;
      }
    } catch(e){
      loaded = null;
    }
    entries = loaded || JSON.parse(JSON.stringify(SEED_ENTRIES));

    // One-time migration: give any entry that predates this feature (or has
    // a malformed id) a proper static 16-character alphanumeric ID.
    let migrated = false;
    entries.forEach(e => {
      if(!e.id || !/^pltfrm[A-Za-z0-9]{16}$/.test(e.id)){
        e.id = generateEntryId();
        migrated = true;
      }
    });

    render();
    if(migrated && !READONLY_MODE) await saveEntries();
  }

  async function saveEntries(){
    isSaving = true;
    const payload = JSON.stringify(entries);
    try{
      if(hasClaudeStorage){
        const attempt = async () => window.storage.set(STORAGE_KEY, payload, true);
        let result = await attempt();
        if(!result){ result = await attempt(); }
        if(!result){ toast('Could not save — try again'); }
      } else {
        localStorage.setItem(STORAGE_KEY, payload);
      }
    } catch(e){
      console.error('Storage save failed:', e);
      toast('Storage error — try again');
    } finally {
      isSaving = false;
    }
  }

  function sortList(list){
    const sorted = list.slice();
    if(sortBy === 'title-asc'){
      sorted.sort((a,b) => a.title.localeCompare(b.title, undefined, { sensitivity: 'base' }));
    } else if(sortBy === 'title-desc'){
      sorted.sort((a,b) => b.title.localeCompare(a.title, undefined, { sensitivity: 'base' }));
    } else if(sortBy === 'dept-asc'){
      sorted.sort((a,b) => (a.department||'').localeCompare(b.department||'', undefined, { sensitivity: 'base' }) || a.title.localeCompare(b.title, undefined, { sensitivity: 'base' }));
    } else if(sortBy === 'oldest'){
      sorted.sort((a,b) => (a.createdAt||0) - (b.createdAt||0));
    } else {
      sorted.sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
    }
    return sorted;
  }

  function populateDeptFilter(sourceList){
    const depts = Array.from(new Set(sourceList.map(e => (e.department||'').trim()).filter(Boolean)))
      .sort((a,b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));
    const prevValue = deptSelectEl.value || 'all';
    deptSelectEl.innerHTML = '<option value="all">All departments</option>' +
      depts.map(d => `<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`).join('');
    deptSelectEl.value = depts.includes(prevValue) ? prevValue : 'all';
    deptFilter = deptSelectEl.value;
  }

  function render(){
    const active = entries.filter(e => e.status !== 'removed');
    const removed = entries.filter(e => e.status === 'removed');
    countActiveEl.textContent = active.length;
    countRemovedEl.textContent = removed.length;

    const baseList = currentTab === 'active' ? active : removed;
    populateDeptFilter(baseList);

    const isCategory = viewMode === 'category';
    registryInnerEl.classList.toggle('category-mode', isCategory);
    const deptFilterGroup = deptSelectEl.closest('.rg-control-group');
    if(deptFilterGroup) deptFilterGroup.style.display = isCategory ? 'none' : 'flex';
    pageSizeGroupEl.style.display = (isCategory || viewMode === 'grid') ? 'none' : 'flex';

    const deptSearchOptionEl = searchFieldEl.querySelector('option[value="department"]');
    if(deptSearchOptionEl){
      deptSearchOptionEl.hidden = isCategory;
      deptSearchOptionEl.disabled = isCategory;
    }
    if(isCategory && searchField === 'department'){
      searchField = 'title';
      searchFieldEl.value = 'title';
    }

    const query = searchQuery.trim().toLowerCase();
    function matchesSearch(e){
      if(!query) return true;
      if(searchField === 'title') return (e.title||'').toLowerCase().includes(query);
      if(searchField === 'department') return (e.department||'').toLowerCase().includes(query);
      if(searchField === 'description') return plainText(e.description||'').toLowerCase().includes(query);
      return true;
    }

    let list;

    if(isCategory){
      const groups = {};
      baseList.forEach(e => {
        const dept = (e.department||'').trim() || 'Uncategorized';
        (groups[dept] = groups[dept] || []).push(e);
      });
      const deptKeys = Object.keys(groups).sort((a,b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));

      if(deptKeys.length === 0){
        categoryDept = null;
      } else if(!categoryDept || !groups[categoryDept]){
        categoryDept = deptKeys[0];
      }

      renderDeptTabs(deptKeys);
      renderCategorySidebar(groups, deptKeys);

      list = categoryDept ? groups[categoryDept].filter(matchesSearch) : [];
      list = sortList(list);
    } else {
      deptTabsEl.classList.remove('visible');
      deptTabsEl.innerHTML = '';

      list = deptFilter === 'all' ? baseList : baseList.filter(e => (e.department||'').trim() === deptFilter);
      list = list.filter(matchesSearch);
      list = sortList(list);
    }

    listEl.className = 'rg-list' + (viewMode === 'grid' ? ' grid-view' : (isCategory ? ' category-view' : ' list-view'));

    const pageSize = isCategory ? Math.max(1, list.length) : (viewMode === 'grid' ? GRID_PAGE_SIZE : Math.max(1, listPageSize));
    const totalItems = list.length;
    const totalPages = isCategory ? 1 : Math.max(1, Math.ceil(totalItems / pageSize));
    if(currentPage > totalPages) currentPage = totalPages;
    if(currentPage < 1) currentPage = 1;

    if(totalItems === 0){
      const deptFiltered = !isCategory && deptFilter !== 'all';
      listEl.innerHTML = query
        ? `<div class="rg-empty"><p class="rg-empty-title">No matches</p><p>Nothing matches "${escapeHtml(searchQuery.trim())}" in ${searchField}${isCategory && categoryDept ? ` within ${escapeHtml(categoryDept)}` : ''}. Try a different term or field.</p></div>`
        : (deptFiltered
          ? `<div class="rg-empty"><p class="rg-empty-title">No entries in this department</p><p>Try a different department or switch back to "All departments".</p></div>`
          : (isCategory
            ? `<div class="rg-empty"><p class="rg-empty-title">Nothing here yet</p><p>${categoryDept ? `No entries under ${escapeHtml(categoryDept)}.` : 'Add an entry with a department to populate this view.'}</p></div>`
            : (currentTab === 'active'
              ? `<div class="rg-empty"><p class="rg-empty-title">Nothing logged yet</p><p>Add the first entry to start the shared list.</p></div>`
              : `<div class="rg-empty"><p class="rg-empty-title">The archive is empty</p><p>Removed entries will land here until they're restored or cleared for good.</p></div>`)));
      lastPagedIds = [];
      updateBulkBar([]);
      renderPagination(0, 1);
      return;
    }

    const startIdx = isCategory ? 0 : (currentPage - 1) * pageSize;
    const pagedList = isCategory ? list : list.slice(startIdx, startIdx + pageSize);
    lastPagedIds = pagedList.map(e => e.id);

    listEl.innerHTML = pagedList.map(e => renderCard(e)).join('');

    pagedList.forEach(e => {
      const card = document.getElementById('card-' + e.id);
      if(!card) return;
      if(!READONLY_MODE){
        if(currentTab === 'active'){
          card.querySelector('.rg-edit-btn').addEventListener('click', () => openModal(e.id));
          card.querySelector('.rg-remove-btn').addEventListener('click', () => removeEntry(e.id));
        } else {
          card.querySelector('.rg-restore-btn').addEventListener('click', () => restoreEntry(e.id));
          card.querySelector('.rg-delete-btn').addEventListener('click', () => confirmDeleteIds([e.id]));
        }
      }
      const suggestEditBtn = card.querySelector('.rg-suggest-edit-btn');
      if(suggestEditBtn){
        suggestEditBtn.addEventListener('click', () => openSuggestionModal(e));
      }
      const idBtn = card.querySelector('.rg-card-id-btn');
      if(idBtn){
        idBtn.addEventListener('click', () => {
          copyToClipboard(idBtn.getAttribute('data-copy-id'));
          toast('Entry ID copied');
        });
      }
      const checkEl = card.querySelector('.rg-card-check');
      if(checkEl){
        checkEl.addEventListener('change', () => {
          if(checkEl.checked){ selectedIds.add(e.id); } else { selectedIds.delete(e.id); }
          updateBulkBar(pagedList);
        });
      }
      const descEl = card.querySelector('.rg-card-desc');
      const toggleEl = card.querySelector('.rg-desc-toggle');
      if(descEl && toggleEl){
        const isExpanded = expandedIds.has(e.id);
        if(!isExpanded){
          requestAnimationFrame(() => {
            if(descEl.scrollHeight - descEl.clientHeight > 2){
              toggleEl.classList.add('visible');
            }
          });
        } else {
          toggleEl.classList.add('visible');
        }
        toggleEl.addEventListener('click', () => {
          if(expandedIds.has(e.id)){ expandedIds.delete(e.id); } else { expandedIds.add(e.id); }
          render();
        });
      }
    });

    updateBulkBar(pagedList);
    if(isCategory){ paginationEl.innerHTML = ''; } else { renderPagination(totalItems, totalPages); }
  }

  function renderDeptTabs(deptKeys){
    deptTabsEl.classList.toggle('visible', deptKeys.length > 0);
    deptTabsEl.innerHTML = deptKeys.map(dept =>
      `<button type="button" class="rg-dept-tab${dept === categoryDept ? ' active' : ''}" data-dept="${escapeHtml(dept)}">${escapeHtml(dept)}</button>`
    ).join('');
    deptTabsEl.querySelectorAll('.rg-dept-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        categoryDept = btn.getAttribute('data-dept');
        collapsedDepts.delete(categoryDept);
        resetPage();
        render();
      });
    });
  }

  function renderCategorySidebar(groups, deptKeys){
    categorySidebarEl.innerHTML = deptKeys.map(dept => {
      const items = sortList(groups[dept]);
      const isActive = dept === categoryDept;
      const isCollapsed = collapsedDepts.has(dept);
      const entryItems = items.map(e =>
        `<button type="button" class="rg-toc-entry" data-id="${e.id}" data-dept="${escapeHtml(dept)}">${escapeHtml(e.title)}</button>`
      ).join('');
      return `
        <div class="rg-toc-dept">
          <div class="rg-toc-dept-header${isActive ? ' active' : ''}" data-dept="${escapeHtml(dept)}">
            <span class="rg-toc-chevron${isCollapsed ? ' collapsed' : ''}" data-toggle-dept="${escapeHtml(dept)}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </span>
            <span class="rg-toc-dept-name">${escapeHtml(dept)}</span>
            <span class="rg-toc-dept-count">${items.length}</span>
          </div>
          <ul class="rg-toc-entries${isCollapsed ? ' collapsed' : ''}">${entryItems}</ul>
        </div>`;
    }).join('');

    categorySidebarEl.querySelectorAll('.rg-toc-chevron').forEach(el => {
      el.addEventListener('click', (ev) => {
        ev.stopPropagation();
        const dept = el.getAttribute('data-toggle-dept');
        if(collapsedDepts.has(dept)){ collapsedDepts.delete(dept); } else { collapsedDepts.add(dept); }
        render();
      });
    });
    categorySidebarEl.querySelectorAll('.rg-toc-dept-header').forEach(el => {
      el.addEventListener('click', () => {
        const dept = el.getAttribute('data-dept');
        categoryDept = dept;
        collapsedDepts.delete(dept);
        resetPage();
        render();
      });
    });
    categorySidebarEl.querySelectorAll('.rg-toc-entry').forEach(el => {
      el.addEventListener('click', () => {
        const dept = el.getAttribute('data-dept');
        const id = el.getAttribute('data-id');
        categoryDept = dept;
        collapsedDepts.delete(dept);
        resetPage();
        render();
        requestAnimationFrame(() => {
          const card = document.getElementById('card-' + id);
          if(card){
            card.scrollIntoView({ behavior: 'smooth', block: 'center' });
            card.classList.add('rg-card-flash');
            setTimeout(() => card.classList.remove('rg-card-flash'), 1500);
          }
        });
      });
    });
  }

  function renderPagination(totalItems, totalPages){
    if(totalItems === 0 || totalPages <= 1){
      paginationEl.innerHTML = '';
      return;
    }
    paginationEl.innerHTML = `
      <button class="rg-page-btn" id="rg-page-prev" ${currentPage <= 1 ? 'disabled' : ''}>‹ Prev</button>
      <span class="rg-page-info">Page ${currentPage} of ${totalPages}</span>
      <button class="rg-page-btn" id="rg-page-next" ${currentPage >= totalPages ? 'disabled' : ''}>Next ›</button>`;
    document.getElementById('rg-page-prev').addEventListener('click', () => {
      if(currentPage > 1){ currentPage--; render(); }
    });
    document.getElementById('rg-page-next').addEventListener('click', () => {
      if(currentPage < totalPages){ currentPage++; render(); }
    });
  }

  function updateBulkBar(visibleList){
    const visibleIds = visibleList.map(e => e.id);
    const selectAllCheckbox = document.getElementById('rg-select-all-checkbox');
    const selectAllLabel = document.getElementById('rg-select-all-label');
    const actionsEl = document.getElementById('rg-bulk-actions');

    const selectedVisibleCount = visibleIds.filter(id => selectedIds.has(id)).length;
    selectAllCheckbox.checked = visibleIds.length > 0 && selectedVisibleCount === visibleIds.length;
    selectAllCheckbox.indeterminate = selectedVisibleCount > 0 && selectedVisibleCount < visibleIds.length;
    selectAllLabel.textContent = visibleIds.length > 0
      ? `Select all visible (${visibleIds.length})`
      : 'Select all visible';

    const totalSelected = selectedIds.size;
    if(totalSelected === 0){
      actionsEl.innerHTML = `<span class="rg-bulk-count">No entries selected</span>`;
      return;
    }

    const countLabel = `${totalSelected} selected`;
    if(currentTab === 'active'){
      actionsEl.innerHTML = `
        <span class="rg-bulk-count">${countLabel}</span>
        <button class="rg-bulk-btn primary" id="rg-bulk-archive">Archive selected</button>`;
      document.getElementById('rg-bulk-archive').addEventListener('click', bulkArchive);
    } else {
      actionsEl.innerHTML = `
        <span class="rg-bulk-count">${countLabel}</span>
        <button class="rg-bulk-btn" id="rg-bulk-restore">Restore selected</button>
        <button class="rg-bulk-btn primary" id="rg-bulk-delete">Delete forever</button>`;
      document.getElementById('rg-bulk-restore').addEventListener('click', bulkRestore);
      document.getElementById('rg-bulk-delete').addEventListener('click', () => confirmDeleteIds(Array.from(selectedIds)));
    }
  }

  document.getElementById('rg-select-all-checkbox').addEventListener('change', function(){
    if(this.checked){
      lastPagedIds.forEach(id => selectedIds.add(id));
    } else {
      lastPagedIds.forEach(id => selectedIds.delete(id));
    }
    render();
  });

  sortSelectEl.addEventListener('change', () => { sortBy = sortSelectEl.value; resetPage(); render(); });
  searchInputEl.addEventListener('input', () => { searchQuery = searchInputEl.value; resetPage(); render(); });
  searchFieldEl.addEventListener('change', () => { searchField = searchFieldEl.value; resetPage(); render(); });
  deptSelectEl.addEventListener('change', () => { deptFilter = deptSelectEl.value; resetPage(); render(); });

  pageSizeInputEl.addEventListener('change', () => {
    let val = parseInt(pageSizeInputEl.value, 10);
    if(!Number.isFinite(val) || val < 1) val = 1;
    listPageSize = val;
    pageSizeInputEl.value = val;
    resetPage();
    render();
  });

  document.getElementById('rg-view-category').addEventListener('click', () => setViewMode('category'));
  document.getElementById('rg-view-list').addEventListener('click', () => setViewMode('list'));
  document.getElementById('rg-view-grid').addEventListener('click', () => setViewMode('grid'));

  function setViewMode(mode){
    if(viewMode === mode) return;
    viewMode = mode;
    resetPage();
    document.getElementById('rg-view-category').classList.toggle('active', mode === 'category');
    document.getElementById('rg-view-list').classList.toggle('active', mode === 'list');
    document.getElementById('rg-view-grid').classList.toggle('active', mode === 'grid');
    render();
  }

  function renderCard(e){
    const safeTitle = escapeHtml(e.title);
    const safeDept = escapeHtml((e.department || '').trim());
    const safeBrand = escapeHtml((e.brand || '').trim());
    const safeAiModel = escapeHtml((e.aiModel || '').trim());
    const descHtml = e.description ? sanitizeRichHtml(e.description) : '';
    const hasDesc = descHtml && !htmlIsBlank(descHtml);
    const safeLink = e.link ? escapeHtml(normalizeUrl(e.link)) : '';
    const safeDemoFiles = e.demoFiles ? escapeHtml(normalizeUrl(e.demoFiles)) : '';
    const safePoc = escapeHtml((e.pointOfContact || '').trim());
    const stampLabel = e.status === 'removed'
      ? 'removed ' + formatDate(e.removedAt)
      : (e.updatedAt && e.updatedAt !== e.createdAt ? 'updated ' + formatDate(e.updatedAt) : 'added ' + formatDate(e.createdAt));

    const actions = READONLY_MODE ? '' : (currentTab === 'active'
      ? `<button class="rg-icon-btn rg-edit-btn" title="Edit entry" aria-label="Edit entry">
           <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
         </button>
         <button class="rg-icon-btn danger rg-remove-btn" title="Move to Archive" aria-label="Remove entry">
           <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
         </button>`
      : `<button class="rg-icon-btn ok rg-restore-btn" title="Restore entry" aria-label="Restore entry">
           <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
         </button>
         <button class="rg-icon-btn danger rg-delete-btn" title="Delete permanently" aria-label="Delete permanently">
           <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
         </button>`);

    return `
      <div class="rg-card ${e.status === 'removed' ? 'removed' : ''}" id="card-${e.id}">
        <div class="rg-card-top">
          ${READONLY_MODE ? '' : `<div class="rg-card-check-wrap">
            <input type="checkbox" class="rg-card-check" data-id="${e.id}" aria-label="Select entry"${selectedIds.has(e.id) ? ' checked' : ''}>
          </div>`}
          <h3 class="rg-card-title">${safeTitle}${safeDept ? `<span class="rg-chip rg-chip-dept">${safeDept}</span>` : ''}${safeAiModel ? `<span class="rg-chip rg-chip-ai">${safeAiModel}</span>` : ''}</h3>
          ${e.status !== 'removed' ? `<button type="button" class="rg-suggest-edit-btn" data-id="${e.id}" title="Suggest an edit to this entry" aria-label="Suggest an edit to this entry">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          </button>` : ''}
        </div>
        ${safeBrand ? `<div class="rg-tag-row">
          <span class="rg-chip rg-chip-outline">${safeBrand}</span>
        </div>` : ''}
        ${hasDesc ? `<div class="rg-card-desc${expandedIds.has(e.id) ? '' : ' clamped'}">${descHtml}</div>
        <button class="rg-desc-toggle" type="button">${expandedIds.has(e.id) ? 'Show less' : 'Show more'}</button>` : ''}
        ${safePoc ? `<div class="rg-card-poc"><span class="rg-card-poc-label">Point of Contact</span> ${safePoc}</div>` : ''}
        ${(safeLink || safeDemoFiles) ? `<div class="rg-card-link-row">
          ${safeLink ? `<a href="${safeLink}" target="_blank" rel="noopener noreferrer">Access ↗</a>` : ''}
          ${safeDemoFiles ? `<a href="${safeDemoFiles}" class="rg-link-secondary" target="_blank" rel="noopener noreferrer">Demo Files ↗</a>` : ''}
        </div>` : ''}
        <div class="rg-card-bottom">
          <div class="rg-card-meta">
            <button type="button" class="rg-card-id-btn" data-copy-id="${e.id}" title="Copy entry ID">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              <span class="rg-card-id-text">${e.id}</span>
            </button>
            <span class="rg-stamp">${stampLabel}</span>
          </div>
          <div class="rg-actions">${actions}</div>
        </div>
      </div>`;
  }

  // ---------- Tabs ----------
  document.getElementById('rg-tab-active').addEventListener('click', () => switchTab('active'));
  document.getElementById('rg-tab-removed').addEventListener('click', () => switchTab('removed'));
  function switchTab(tab){
    if(READONLY_MODE && tab === 'removed') return;
    currentTab = tab;
    selectedIds.clear();
    resetPage();
    document.getElementById('rg-tab-active').classList.toggle('active', tab === 'active');
    document.getElementById('rg-tab-removed').classList.toggle('active', tab === 'removed');
    render();
  }

  // ---------- Combo field (select existing value, or add a new one) ----------
  function buildComboFieldHtml(fieldId, labelText, options, currentValue){
    const hasCurrentInOptions = currentValue && options.some(o => o.toLowerCase() === currentValue.toLowerCase());
    const showNewInput = !!currentValue && !hasCurrentInOptions;
    const optionsHtml = options.map(o => `<option value="${escapeHtml(o)}" ${o === currentValue ? 'selected' : ''}>${escapeHtml(o)}</option>`).join('');
    return `
      <div class="rg-field">
        <label for="${fieldId}-select">${labelText}</label>
        <select id="${fieldId}-select" class="rg-combo-select" data-field="${fieldId}" style="${showNewInput ? 'display:none' : ''}">
          <option value="">— None —</option>
          ${optionsHtml}
          <option value="__new__">+ Add new…</option>
        </select>
        <div class="rg-combo-new" data-field="${fieldId}" style="${showNewInput ? '' : 'display:none'}">
          <input type="text" id="${fieldId}-new" maxlength="80" placeholder="Type a new ${labelText.toLowerCase()}" value="${showNewInput ? escapeHtml(currentValue) : ''}">
          <button type="button" class="rg-combo-back" data-target="${fieldId}">Choose existing</button>
        </div>
      </div>`;
  }

  function setupComboField(fieldId){
    const select = document.getElementById(fieldId + '-select');
    const newWrap = document.querySelector(`.rg-combo-new[data-field="${fieldId}"]`);

  // ---------- Submit New Tool: exports a submission as a templated CSV ----------
  // Column order is fixed and must match what Upload Submission expects.
  const SUBMISSION_CSV_HEADERS = ['Entry ID', 'Title', 'Department', 'Brand', 'AI Model', 'Point of Contact', 'Link', 'Demo Files', 'Description', 'Submitted At'];

  function csvEscape(value){
    const str = String(value == null ? '' : value);
    if(/[",\n\r]/.test(str)){
      return '"' + str.replace(/"/g, '""') + '"';
    }
    return str;
  }

  function buildSubmissionCsv(sub){
    const row = [
      sub.entryId, sub.title, sub.department, sub.brand, sub.aiModel,
      sub.pointOfContact, sub.link, sub.demoFiles, sub.description,
      new Date(sub.submittedAt).toLocaleString()
    ];
    return SUBMISSION_CSV_HEADERS.map(csvEscape).join(',') + '\r\n' + row.map(csvEscape).join(',') + '\r\n';
  }

  // Minimal RFC4180-style CSV parser: handles quoted fields, embedded commas,
  // embedded quotes ("") and embedded newlines within quoted fields.
  function parseCsv(text){
    const rows = [];
    let row = [];
    let field = '';
    let inQuotes = false;
    for(let i = 0; i < text.length; i++){
      const char = text[i];
      if(inQuotes){
        if(char === '"'){
          if(text[i + 1] === '"'){ field += '"'; i++; }
          else { inQuotes = false; }
        } else {
          field += char;
        }
      } else if(char === '"'){
        inQuotes = true;
      } else if(char === ','){
        row.push(field); field = '';
      } else if(char === '\r'){
        // skip; \n (below) closes the row
      } else if(char === '\n'){
        row.push(field); field = '';
        rows.push(row); row = [];
      } else {
        field += char;
      }
    }
    if(field.length > 0 || row.length > 0){ row.push(field); rows.push(row); }
    return rows.filter(r => !(r.length === 1 && r[0].trim() === ''));
  }

  // ---------- Upload Submission: reads a Submit New Tool CSV and adds it as an entry ----------
  function findSubmissionColumnIndex(header, name){
    return header.findIndex(h => h.trim().toLowerCase() === name.toLowerCase());
  }

  async function handleUploadFile(file){
    if(READONLY_MODE) return;
    let text;
    try{
      text = await file.text();
    } catch(e){
      toast('Could not read that file');
      return;
    }

    const rows = parseCsv(text);
    if(rows.length < 2){
      toast('No submission rows found in that file');
      return;
    }

    const header = rows[0];
    const idx = {
      entryId: findSubmissionColumnIndex(header, 'Entry ID'),
      title: findSubmissionColumnIndex(header, 'Title'),
      department: findSubmissionColumnIndex(header, 'Department'),
      brand: findSubmissionColumnIndex(header, 'Brand'),
      aiModel: findSubmissionColumnIndex(header, 'AI Model'),
      pointOfContact: findSubmissionColumnIndex(header, 'Point of Contact'),
      link: findSubmissionColumnIndex(header, 'Link'),
      demoFiles: findSubmissionColumnIndex(header, 'Demo Files'),
      description: findSubmissionColumnIndex(header, 'Description')
    };

    if(idx.title === -1){
      toast("That file doesn't match the expected submission format");
      return;
    }

    let added = 0;
    let updated = 0;
    let notFound = 0;
    const now = Date.now();
    rows.slice(1).forEach(r => {
      const title = (r[idx.title] || '').trim();
      if(!title) return;

      const fields = {
        title,
        department: idx.department > -1 ? (r[idx.department] || '').trim() : '',
        brand: idx.brand > -1 ? (r[idx.brand] || '').trim() : '',
        description: idx.description > -1 ? sanitizeRichHtml(r[idx.description] || '') : '',
        link: idx.link > -1 ? (r[idx.link] || '').trim() : '',
        demoFiles: idx.demoFiles > -1 ? (r[idx.demoFiles] || '').trim() : '',
        aiModel: idx.aiModel > -1 ? (r[idx.aiModel] || '').trim() : '',
        pointOfContact: idx.pointOfContact > -1 ? (r[idx.pointOfContact] || '').trim() : ''
      };

      const requestedId = idx.entryId > -1 ? (r[idx.entryId] || '').trim() : '';
      const existing = requestedId ? entries.find(e => e.id === requestedId) : null;

      if(existing){
        Object.assign(existing, fields);
        existing.updatedAt = now;
        updated++;
      } else {
        if(requestedId) notFound++;
        entries.push({
          id: generateEntryId(),
          ...fields,
          status: 'active',
          createdAt: now,
          updatedAt: now
        });
        added++;
      }
    });

    if(added === 0 && updated === 0){
      toast('No valid entries found in that file');
      return;
    }
    render();
    const parts = [];
    if(updated > 0) parts.push(`${updated} ${updated === 1 ? 'entry' : 'entries'} updated`);
    if(added > 0) parts.push(`${added} new ${added === 1 ? 'entry' : 'entries'} added`);
    let message = parts.join(', ');
    if(notFound > 0) message += ` (${notFound} referenced an ID that wasn't found, so ${notFound === 1 ? 'it was' : 'they were'} added as new)`;
    toast(message);
    await saveEntries();
  }

  // ---------- Remove / restore / delete ----------
  async function removeEntry(id){
    const entry = entries.find(e => e.id === id);
    if(!entry) return;
    entry.status = 'removed';
    entry.removedAt = Date.now();
    render();
    toast('Moved to Archive');
    await saveEntries();
  }

  async function restoreEntry(id){
    const entry = entries.find(e => e.id === id);
    if(!entry) return;
    entry.status = 'active';
    delete entry.removedAt;
    render();
    toast('Entry restored');
    await saveEntries();
  }

  async function bulkArchive(){
    const ids = Array.from(selectedIds);
    if(ids.length === 0) return;
    entries.forEach(e => {
      if(ids.includes(e.id) && e.status !== 'removed'){
        e.status = 'removed';
        e.removedAt = Date.now();
      }
    });
    selectedIds.clear();
    render();
    toast(`${ids.length} ${ids.length === 1 ? 'entry' : 'entries'} moved to Archive`);
    await saveEntries();
  }

  async function bulkRestore(){
    const ids = Array.from(selectedIds);
    if(ids.length === 0) return;
    entries.forEach(e => {
      if(ids.includes(e.id) && e.status === 'removed'){
        e.status = 'active';
        delete e.removedAt;
      }
    });
    selectedIds.clear();
    render();
    toast(`${ids.length} ${ids.length === 1 ? 'entry' : 'entries'} restored`);
    await saveEntries();
  }

  function confirmDeleteIds(ids){
    if(ids.length === 0) return;
    pendingDeleteIds = ids;
    const overlay = document.createElement('div');
    overlay.className = 'rg-modal-overlay';
    overlay.id = 'rg-confirm-overlay';
    const plural = ids.length === 1 ? 'entry' : 'entries';
    overlay.innerHTML = `
      <div class="rg-modal" role="dialog" aria-modal="true">
        <h2>Delete permanently?</h2>
        <p style="font-size:14px; color: var(--gray-500); margin: 0 0 4px;">This can't be undone. ${ids.length} ${plural} will be gone for good.</p>
        <div class="rg-modal-actions">
          <button class="rg-btn secondary" id="rg-confirm-cancel">Cancel</button>
          <button class="rg-btn danger" id="rg-confirm-delete">Delete forever</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    document.getElementById('rg-confirm-cancel').addEventListener('click', () => overlay.remove());
    overlay.addEventListener('click', (ev) => { if(ev.target === overlay) overlay.remove(); });
    document.getElementById('rg-confirm-delete').addEventListener('click', async () => {
      entries = entries.filter(e => !pendingDeleteIds.includes(e.id));
      selectedIds.forEach(id => { if(pendingDeleteIds.includes(id)) selectedIds.delete(id); });
      overlay.remove();
      render();
      toast(`${pendingDeleteIds.length} ${pendingDeleteIds.length === 1 ? 'entry' : 'entries'} deleted`);
      await saveEntries();
    });
  }

  document.getElementById('rg-export-btn').addEventListener('click', exportDashboard);

  const uploadInputEl = document.getElementById('rg-upload-input');
  document.getElementById('rg-upload-submission-btn').addEventListener('click', () => {
    uploadInputEl.value = '';
    uploadInputEl.click();
  });
  uploadInputEl.addEventListener('change', () => {
    const file = uploadInputEl.files && uploadInputEl.files[0];
    if(file) handleUploadFile(file);
  });

  // ---------- Live polling so other users' changes appear ----------
  function startPolling(){
    pollTimer = setInterval(async () => {
      if(modalOpen || isSaving) return;
      try{
        const res = await window.storage.get(STORAGE_KEY, true);
        const fresh = res && res.value ? JSON.parse(res.value) : [];
        if(JSON.stringify(fresh) !== JSON.stringify(entries)){
          entries = fresh;
          render();
        }
      } catch(e){ /* ignore transient errors */ }
    }, 5000);
  }

  if(READONLY_MODE){
    const newBtn = document.getElementById('rg-new-entry-btn');
    if(newBtn) newBtn.style.display = 'none';
    const archiveTabBtn = document.getElementById('rg-tab-removed');
    if(archiveTabBtn) archiveTabBtn.style.display = 'none';
    const bulkBar = document.querySelector('.rg-bulk-bar');
    if(bulkBar) bulkBar.style.display = 'none';
    const exportBtn = document.getElementById('rg-export-btn');
    if(exportBtn) exportBtn.style.display = 'none';
    const uploadBtn = document.getElementById('rg-upload-submission-btn');
    if(uploadBtn) uploadBtn.style.display = 'none';
  }

  if(hasClaudeStorage){
    loadEntries().then(startPolling);
  } else {
    document.querySelector('.rg-eyebrow').textContent = READONLY_MODE
      ? 'A directory of shared AI tools'
      : 'Saved in this browser — use Export to update the shared file';
    // Standalone / GitHub Pages mode: entries persist in this browser via
    // localStorage. Keep other open tabs on the same device in sync too.
    loadEntries();
    window.addEventListener('storage', (ev) => {
      if(ev.key === STORAGE_KEY && !modalOpen){
        loadEntries();
      }
    });
  }
})();

</script>
</body>
</html>
